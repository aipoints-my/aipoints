<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AIPOINTS</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  min-height:100vh;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.10);
  z-index:-1;
}

.page-wrap{
  max-width:760px;
  margin:0 auto;
  padding:20px;
}

.topbar{
  text-align:right;
  margin-bottom:20px;
}

.topbar select{
  width:160px;
  padding:12px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,0.92);
  font-size:18px;
}

.container{
  max-width:560px;
  margin:0 auto;
  padding:10px 0 30px;
  background:transparent;
  border:none;
  box-shadow:none;
}

.logo{
  display:block;
  max-width:230px;
  margin:20px auto;
}

h1{
  text-align:center;
  color:#ff8c00;
  font-size:58px;
  margin:20px 0 10px;
  font-weight:900;
}

p{
  text-align:center;
  color:#666;
  font-size:24px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:20px;
  margin-bottom:18px;
  border-radius:18px;
  border:none;
  font-size:22px;
  box-sizing:border-box;
  background:rgba(255,255,255,0.88);
}

button{
  width:100%;
  padding:22px;
  border:none;
  border-radius:18px;
  color:white;
  font-size:24px;
  margin-bottom:18px;
  cursor:pointer;
  font-weight:900;
}

.orange{background:#ff8c00}
.green{background:#43c553}
.blue{background:#2e8cff}
.purple{background:#9c27b0}
.gray{background:#777}

.hidden{
  display:none;
}

.card{
  background:rgba(255,255,255,0.82);
  padding:20px;
  border-radius:20px;
  text-align:center;
  margin:15px 0;
}

.points{
  font-size:60px;
  font-weight:bold;
  color:#ff8c00;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
}

@media(max-width:600px){

h1{
  font-size:42px;
}

p{
  font-size:18px;
}

button{
  font-size:22px;
}

input{
  font-size:20px;
}

}
</style>
</head>

<body>

<div class="page-wrap">

<div class="topbar">
<select id="languageSelect">
<option>English</option>
<option>中文</option>
</select>
</div>

<div class="container" id="loginPage">

<img id="headerLogo1" class="logo hidden">

<h1>CUSTOMER REWARDS</h1>

<p>AIPOINTS SYSTEM</p>

<input type="text" id="loginPhone" placeholder="Customer Phone">

<button class="orange" onclick="login()">Customer Login</button>

<button class="green" onclick="showRegisterPage()">Register Member</button>

<button class="blue" onclick="showStaffLogin()">Staff Panel</button>

<button class="purple" onclick="showBossLogin()">Boss Panel</button>

</div>

<div class="container hidden" id="registerPage">

<h1>Register Member</h1>

<input type="text" id="regName" placeholder="Customer Name">

<input type="text" id="regPhone" placeholder="Phone Number">

<input type="email" id="regEmail" placeholder="Email">

<button class="green" onclick="registerMember()">Submit Register</button>

<button class="gray" onclick="backToLogin()">Back</button>

</div>

<div class="container hidden" id="dashboardPage">

<h1>Member Dashboard</h1>

<div class="card">
<p>Current Points</p>
<div class="points" id="pointsText">0</div>
</div>

<p id="memberInfo"></p>

<button class="green" id="memberWhatsappBtn">Open WhatsApp</button>

<button class="gray" onclick="logout()">Logout</button>

</div>

<div class="container hidden" id="staffLoginPage">

<h1>Staff Login</h1>

<input type="password" id="staffPasswordInput" placeholder="Staff Password">

<button class="blue" onclick="staffLogin()">Login Staff</button>

<button class="gray" onclick="backToLogin()">Back</button>

</div>

<div class="container hidden" id="staffPage">

<h1>Staff Panel</h1>

<input type="text" id="customerPhone" placeholder="Customer Phone">

<select id="staffAction">
<option value="add">Add Points</option>
<option value="deduct">Redeem Points</option>
</select>

<input type="number" id="pointAmount" placeholder="Points">

<button class="blue" onclick="processPoints()">Submit</button>

<div class="card hidden" id="staffResult">
<p id="staffCustomerName"></p>
<div class="points" id="staffCustomerPoints">0</div>
</div>

<button class="gray" onclick="logout()">Logout</button>

</div>

<div class="container hidden" id="bossLoginPage">

<h1>Boss Login</h1>

<input type="password" id="bossPasswordInput" placeholder="Boss Password">

<button class="purple" onclick="bossLogin()">Login Boss</button>

<button class="gray" onclick="backToLogin()">Back</button>

</div>

<div class="container hidden" id="bossPage">

<h1>Boss Dashboard</h1>

<button class="purple" onclick="loadAllMembers()">Refresh Customer List</button>

<button class="green" onclick="downloadCSV()">Download Customer CSV</button>

<input type="text" id="bossCustomerPhone" placeholder="Customer Phone">

<input type="number" id="bossNewPoints" placeholder="Set New Points">

<button class="purple" onclick="setPoints()">Update Points</button>

<div id="customerTable"></div>

<button class="gray" onclick="logout()">Logout</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "YOUR API KEY",
authDomain: "aipoints-859ea.firebaseapp.com",
projectId: "aipoints-859ea",
storageBucket: "aipoints-859ea.appspot.com",
messagingSenderId: "472204890064",
appId: "1:472204890064:web:e47efde9f874981ac7f3d5"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

function hideAll(){

[
"loginPage",
"registerPage",
"dashboardPage",
"staffLoginPage",
"staffPage",
"bossLoginPage",
"bossPage"

].forEach(id=>{

document.getElementById(id).classList.add("hidden");

});

}

window.showRegisterPage=function(){

hideAll();

document.getElementById("registerPage").classList.remove("hidden");

}

window.showStaffLogin=function(){

hideAll();

document.getElementById("staffLoginPage").classList.remove("hidden");

}

window.showBossLogin=function(){

hideAll();

document.getElementById("bossLoginPage").classList.remove("hidden");

}

window.backToLogin=function(){

hideAll();

document.getElementById("loginPage").classList.remove("hidden");

}

window.logout=function(){

hideAll();

document.getElementById("loginPage").classList.remove("hidden");

}

window.registerMember=async function(){

let name=document.getElementById("regName").value;

let phone=document.getElementById("regPhone").value;

let email=document.getElementById("regEmail").value;

if(!name||!phone){

alert("Please fill all info");

return;

}

await setDoc(doc(db,"members",phone),{

name:name,
phone:phone,
email:email,
points:0

});

alert("Member Registered");

backToLogin();

}

window.login=async function(){

let phone=document.getElementById("loginPhone").value;

const docRef=doc(db,"members",phone);

const docSnap=await getDoc(docRef);

if(!docSnap.exists()){

alert("Member not found");

return;

}

let member=docSnap.data();

hideAll();

document.getElementById("dashboardPage").classList.remove("hidden");

document.getElementById("pointsText").innerText=member.points||0;

document.getElementById("memberInfo").innerText=
member.name+" | "+member.phone;

document.getElementById("memberWhatsappBtn").onclick=function(){

window.open(
"https://wa.me/"+member.phone+
"?text="+encodeURIComponent(
"Hi, your AIPOINTS membership points are "+member.points
),
"_blank"
);

}

}

window.staffLogin=function(){

if(document.getElementById("staffPasswordInput").value=="1234"){

hideAll();

document.getElementById("staffPage").classList.remove("hidden");

}else{

alert("Wrong Password");

}

}

window.processPoints=async function(){

let phone=document.getElementById("customerPhone").value;

let amount=Number(document.getElementById("pointAmount").value);

let action=document.getElementById("staffAction").value;

const docRef=doc(db,"members",phone);

const docSnap=await getDoc(docRef);

if(!docSnap.exists()){

alert("Customer not found");

return;

}

let member=docSnap.data();

let points=member.points||0;

if(action=="add"){

points+=amount;

}else{

points-=amount;

}

await updateDoc(docRef,{

points:points

});

document.getElementById("staffResult").classList.remove("hidden");

document.getElementById("staffCustomerName").innerText=member.name;

document.getElementById("staffCustomerPoints").innerText=points;

alert("Updated");

}

window.bossLogin=async function(){

if(document.getElementById("bossPasswordInput").value!="8888"){

alert("Wrong Password");

return;

}

hideAll();

document.getElementById("bossPage").classList.remove("hidden");

loadAllMembers();

}

window.loadAllMembers=async function(){

const querySnapshot=await getDocs(collection(db,"members"));

let html=`
<table>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Points</th>
</tr>
`;

querySnapshot.forEach((docItem)=>{

let m=docItem.data();

html+=`
<tr>
<td>${m.name||""}</td>
<td>${m.phone||""}</td>
<td>${m.email||""}</td>
<td>${m.points||0}</td>
</tr>
`;

});

html+="</table>";

document.getElementById("customerTable").innerHTML=html;

}

window.setPoints=async function(){

let phone=document.getElementById("bossCustomerPhone").value;

let newPoints=Number(document.getElementById("bossNewPoints").value);

await updateDoc(doc(db,"members",phone),{

points:newPoints

});

alert("Points Updated");

loadAllMembers();

}

window.downloadCSV=async function(){

const querySnapshot=await getDocs(collection(db,"members"));

let csv="Name,Phone,Email,Points\n";

querySnapshot.forEach((docItem)=>{

let m=docItem.data();

csv+=`${m.name},${m.phone},${m.email},${m.points}\n`;

});

let blob=new Blob([csv],{

type:"text/csv"

});

let link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="aipoints-customers.csv";

link.click();

}

</script>

</body>
</html>
