<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIPOINTS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
width:100%;
min-height:100vh;
background:url('https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?q=80&w=1974&auto=format&fit=crop') no-repeat center center;
background-size:cover;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
overflow-x:hidden;
}

.overlay{
width:100%;
max-width:420px;
text-align:center;
}

.logo{
width:180px;
margin:0 auto 20px;
display:block;
}

h1{
font-size:58px;
color:#ff8c00;
margin-bottom:10px;
font-weight:800;
text-shadow:0 2px 10px rgba(0,0,0,0.2);
}

.subtitle{
font-size:20px;
color:#555;
margin-bottom:40px;
font-weight:600;
}

input{
width:100%;
padding:18px;
margin-bottom:20px;
border:none;
border-radius:20px;
font-size:20px;
background:rgba(255,255,255,0.9);
}

button{
width:100%;
padding:20px;
margin-bottom:20px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:bold;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.02);
}

.login-btn{
background:#ff9500;
}

.register-btn{
background:#48c157;
}

.staff-btn{
background:#2d8cf0;
}

.boss-btn{
background:#9c27b0;
}

.logout-btn{
background:#777;
}

.points-box{
margin:25px 0;
padding:30px;
background:rgba(255,255,255,0.85);
border-radius:25px;
}

.points-number{
font-size:80px;
font-weight:bold;
color:#ff9500;
}

.language-box{
position:fixed;
top:20px;
right:20px;
z-index:999;
}

select{
padding:15px 20px;
font-size:18px;
border-radius:15px;
border:none;
background:white;
}

.hidden{
display:none;
}

.customer-card{
background:rgba(255,255,255,0.85);
padding:15px;
border-radius:15px;
margin-bottom:10px;
text-align:left;
}

.customer-card button{
margin-top:10px;
padding:12px;
font-size:16px;
}

@media(max-width:768px){

h1{
font-size:42px;
}

.logo{
width:150px;
}

button{
font-size:20px;
padding:18px;
}

.points-number{
font-size:60px;
}

}

</style>
</head>

<body>

<div class="language-box">
<select id="languageSelect">
<option value="en">English</option>
<option value="cn">中文</option>
</select>
</div>

<div class="overlay">

<img src="https://i.imgur.com/4AiXzf8.png" class="logo" id="brandLogo">

<div id="mainPage">

<h1 id="titleText">Milk Tea Demo</h1>

<div class="subtitle" id="subtitleText">
Wonderful Pineapple Point System
</div>

<input type="text" id="customerPhone" placeholder="Customer Phone">

<button class="login-btn" onclick="customerLogin()" id="loginText">
Customer Login
</button>

<button class="register-btn" onclick="registerMember()" id="registerText">
Register Member
</button>

<button class="staff-btn" onclick="showStaffPanel()" id="staffText">
Staff Panel
</button>

<button class="boss-btn" onclick="showBossPanel()" id="bossText">
Boss Panel
</button>

</div>

<div id="memberPage" class="hidden">

<h1>Member Dashboard</h1>

<div class="points-box">
<div>Current Points</div>
<div class="points-number" id="memberPoints">0</div>
</div>

<div id="memberInfo"></div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<div id="staffPage" class="hidden">

<h1>Staff Panel</h1>

<input type="password" id="staffPassword" placeholder="Staff Password">

<button class="staff-btn" onclick="staffLogin()">
Login Staff
</button>

<div id="staffAction" class="hidden">

<input type="text" id="staffCustomerPhone" placeholder="Customer Phone">

<input type="number" id="staffPoints" placeholder="Points">

<select id="pointAction">
<option value="add">Add Points</option>
<option value="redeem">Redeem Points</option>
</select>

<button class="register-btn" onclick="updatePoints()">
Submit
</button>

</div>

<button class="logout-btn" onclick="backHome()">
Back
</button>

</div>

<div id="bossPage" class="hidden">

<h1>Boss Dashboard</h1>

<input type="password" id="bossPassword" placeholder="Boss Password">

<button class="boss-btn" onclick="bossLogin()">
Login Boss
</button>

<div id="bossAction" class="hidden">

<button class="register-btn" onclick="downloadCSV()">
Download Customer CSV
</button>

<div id="customerList"></div>

</div>

<button class="logout-btn" onclick="backHome()">
Back
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAO5EhryOfZIF2Ri4uYUZHxbR_umGfbYak",
authDomain: "aipoints-859ea.firebaseapp.com",
projectId: "aipoints-859ea",
storageBucket: "aipoints-859ea.firebasestorage.app",
messagingSenderId: "472204890064",
appId: "1:472204890064:web:e47efde9f874981ac7f3d5",
measurementId: "G-D9N4R5H7EY"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.registerMember = async function(){

let phone=document.getElementById("customerPhone").value.trim();

if(phone==""){
alert("Please enter phone");
return;
}

if(!phone.startsWith("60")){
phone="60"+phone;
}

const q=query(collection(db,"customers"),where("phone","==",phone));

const snapshot=await getDocs(q);

if(!snapshot.empty){
alert("Phone already registered");
return;
}

await addDoc(collection(db,"customers"),{
phone:phone,
points:0
});

window.open("https://wa.me/"+phone);

alert("Member Registered");

}

window.customerLogin = async function(){

let phone=document.getElementById("customerPhone").value.trim();

if(!phone.startsWith("60")){
phone="60"+phone;
}

const q=query(collection(db,"customers"),where("phone","==",phone));

const snapshot=await getDocs(q);

if(snapshot.empty){
alert("Customer not found");
return;
}

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

document.getElementById("mainPage").classList.add("hidden");

document.getElementById("memberPage").classList.remove("hidden");

document.getElementById("memberPoints").innerText=data.points;

document.getElementById("memberInfo").innerHTML=`
Phone: ${data.phone}
`;

});

}

window.showStaffPanel=function(){

document.getElementById("mainPage").classList.add("hidden");

document.getElementById("staffPage").classList.remove("hidden");

}

window.staffLogin=function(){

const pass=document.getElementById("staffPassword").value;

if(pass=="1234"){

document.getElementById("staffAction").classList.remove("hidden");

}else{

alert("Wrong Password");

}

}

window.updatePoints=async function(){

let phone=document.getElementById("staffCustomerPhone").value.trim();

if(!phone.startsWith("60")){
phone="60"+phone;
}

const points=parseInt(document.getElementById("staffPoints").value);

const action=document.getElementById("pointAction").value;

const q=query(collection(db,"customers"),where("phone","==",phone));

const snapshot=await getDocs(q);

snapshot.forEach(async(d)=>{

const current=d.data().points;

let final=current;

if(action=="add"){
final=current+points;
}else{
final=current-points;
}

await updateDoc(doc(db,"customers",d.id),{
points:final
});

alert("Points Updated");

});

}

window.showBossPanel=function(){

document.getElementById("mainPage").classList.add("hidden");

document.getElementById("bossPage").classList.remove("hidden");

}

window.bossLogin=async function(){

const pass=document.getElementById("bossPassword").value;

if(pass!="8888"){
alert("Wrong Password");
return;
}

document.getElementById("bossAction").classList.remove("hidden");

loadCustomers();

}

async function loadCustomers(){

const snapshot=await getDocs(collection(db,"customers"));

let html="";

snapshot.forEach((d)=>{

const data=d.data();

const whatsapp=`https://wa.me/${data.phone}?text=Your current points is ${data.points}`;

html+=`
<div class="customer-card">
<div><b>Phone:</b> ${data.phone}</div>
<div><b>Points:</b> ${data.points}</div>
<button class="staff-btn" onclick="window.open('${whatsapp}')">
WhatsApp Customer
</button>
</div>
`;

});

document.getElementById("customerList").innerHTML=html;

}

window.downloadCSV=async function(){

const snapshot=await getDocs(collection(db,"customers"));

let csv="Phone,Points\n";

snapshot.forEach((d)=>{

const data=d.data();

csv+=`${data.phone},${data.points}\n`;

});

const blob=new Blob([csv],{type:"text/csv"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="customers.csv";

a.click();

}

window.logout=function(){

location.reload();

}

window.backHome=function(){

location.reload();

}

</script>

</body>
</html>
